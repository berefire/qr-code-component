<!DOCTYPE html>
<html lang="en-US">

<head>

  <title>Frontend Mentor | QR code component</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Berefire">
  <meta name="description"
    content="This QR component website was made by the author using HTML and CSS.">


  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/styles.css" type="text/css">

</head>

<body>
  <main class="layout">
    <section class="card">
      <img class="card__image" src="./assets/images/image-qr-code.png" alt="QR Code leading to Frontend Mentor website">

      <h1 class="card__title">Improve your front-end skills by building projects</h1>
      <p class="card__text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
      </p>

    </section>
  </main>
  <footer>
    <address class="attribution">
      Challenge by <a class="attribution--link" href="https://www.frontendmentor.io?ref=challenge"
        target="_blank">Frontend Mentor</a>.
      Coded by <a class="attribution--link" href="#">Berefire</a>.
    </address>
  </footer>
</body>

</html>
